[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-rover"
version = "0.1.0"
description = "An AI robot that gives physical spaces a memory"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
agent = ["openai>=2.9,<3"]
vision = ["opencv-python-headless>=4.10,<5", "ultralytics>=8.3,<9"]
test = ["pytest>=8,<10", "numpy>=1.26", "opencv-python-headless>=4.10,<5"]

[tool.setuptools.packages.find]
include = ["recall_rover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
